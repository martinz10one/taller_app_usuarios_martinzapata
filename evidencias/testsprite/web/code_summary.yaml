version: "2"
type: frontend
tech_stack:
  - language: JavaScript (ES Modules)
  - framework: Vue 3 (Composition API, script setup)
  - ui_library: CSS propio con variables y componentes Vue (sin librería externa)
  - other: Vue Router 5, Vite 8, Vitest, Playwright
routes:
  - path: /
    file: src/router/index.js
    auth_required: true
    description: Redirige al panel de usuarios si el usuario es admin o al perfil si es usuario normal.
  - path: /login
    file: src/views/LoginView.vue
    auth_required: false
    description: Página de inicio de sesión. Solo para invitados; si hay sesión redirige a /.
  - path: /registro
    file: src/views/RegisterView.vue
    auth_required: false
    description: Página pública para crear una cuenta con rol usuario.
  - path: /usuarios
    file: src/views/UsersView.vue
    auth_required: true
    description: Panel de administración con listado, búsqueda, filtro por rol, paginación y acciones de editar/eliminar. Solo admin.
  - path: /usuarios/nuevo
    file: src/views/UserFormView.vue
    auth_required: true
    description: Formulario para que un admin cree un usuario. Solo admin.
  - path: /usuarios/:id/editar
    file: src/views/UserFormView.vue
    auth_required: true
    description: Formulario para que un admin edite un usuario existente. Solo admin.
  - path: /perfil
    file: src/views/ProfileView.vue
    auth_required: true
    description: Página del perfil autenticado para editar nombre/email y cambiar la contraseña.
  - path: /:pathMatch(.*)*
    file: src/views/NotFoundView.vue
    auth_required: false
    description: Página 404 con enlace para volver al inicio.
features:
  - name: Inicio de sesión
    description: Permite entrar con email y contraseña. Muestra errores de validación y de credenciales, guarda el token en localStorage y redirige según el rol.
    files:
      - src/views/LoginView.vue
      - src/composables/useAuth.js
      - src/services/authApi.js
      - src/services/http.js
      - src/utils/validators.js
    entry_route: /login
    user_interactions:
      - Rellenar el campo Email
      - Rellenar el campo Contraseña
      - Pulsar el botón Iniciar sesión
      - Ver un mensaje de error si las credenciales son inválidas
      - Ser redirigido a /usuarios si el rol es admin o a /perfil si es usuario
    api_calls:
      - method: POST
        endpoint: /api/auth/login
      - method: GET
        endpoint: /api/auth/perfil
    auth_required: false
  - name: Registro de cuenta
    description: Formulario público para crear una cuenta con nombre, email y contraseña. Valida los campos en el cliente y muestra los errores devueltos por la API.
    files:
      - src/views/RegisterView.vue
      - src/composables/useAuth.js
      - src/services/authApi.js
      - src/utils/validators.js
    entry_route: /registro
    user_interactions:
      - Rellenar Nombre completo
      - Rellenar Email
      - Rellenar Contraseña
      - Repetir la contraseña
      - Pulsar el botón Crear cuenta
      - Ver errores de validación si algún campo no cumple las reglas
      - Ver la sesión iniciada y la redirección tras un registro correcto
    api_calls:
      - method: POST
        endpoint: /api/auth/registro
    auth_required: false
  - name: Gestión de usuarios (admin)
    description: Listado paginado de usuarios activos con búsqueda por nombre/email, filtro por rol, creación, edición y borrado lógico mediante diálogo de confirmación.
    files:
      - src/views/UsersView.vue
      - src/views/UserFormView.vue
      - src/components/PaginationBar.vue
      - src/components/ConfirmDialog.vue
      - src/services/usersApi.js
    entry_route: /usuarios
    user_interactions:
      - Ver la tabla de usuarios con nombre, email, rol y fecha de alta
      - Escribir en el buscador para filtrar por nombre o email
      - Cambiar el filtro de rol
      - Cambiar de página con la paginación
      - Pulsar Nuevo usuario y rellenar el formulario
      - Pulsar Editar en una fila y guardar los cambios
      - Pulsar Eliminar y confirmar en el diálogo
      - Ver el mensaje de éxito o de error
    api_calls:
      - method: GET
        endpoint: /api/usuarios
      - method: GET
        endpoint: /api/usuarios/:id
      - method: POST
        endpoint: /api/usuarios
      - method: PUT
        endpoint: /api/usuarios/:id
      - method: DELETE
        endpoint: /api/usuarios/:id
    auth_required: true
  - name: Perfil y contraseña
    description: El usuario autenticado puede cambiar su nombre y email, y cambiar su contraseña indicando la actual y repitiendo la nueva.
    files:
      - src/views/ProfileView.vue
      - src/composables/useAuth.js
      - src/services/authApi.js
    entry_route: /perfil
    user_interactions:
      - Ver los datos actuales del perfil
      - Cambiar el Nombre completo y pulsar Guardar cambios
      - Cambiar el Email y pulsar Guardar cambios
      - Rellenar Contraseña actual, Nueva contraseña y Repite la nueva contraseña
      - Pulsar Cambiar contraseña
      - Ver mensajes de éxito o de error
    api_calls:
      - method: PUT
        endpoint: /api/auth/perfil
      - method: PUT
        endpoint: /api/auth/password
    auth_required: true
  - name: Navegación, sesión y 404
    description: Cabecera con enlaces según el rol, cierre de sesión y protección de rutas. Una URL desconocida muestra la página 404.
    files:
      - src/components/AppHeader.vue
      - src/router/index.js
      - src/composables/useAuth.js
      - src/views/NotFoundView.vue
    entry_route: /
    user_interactions:
      - Ver los enlaces Usuarios y Mi perfil según el rol
      - Pulsar Cerrar sesión
      - Intentar abrir /usuarios sin ser admin y ser redirigido a /perfil
      - Abrir una URL inexistente y ver la página 404
      - Pulsar el enlace Volver al inicio de la página 404
    api_calls: []
    auth_required: true
known_limitations:
  - issue: El frontend llama a /api y depende del proxy de Vite hacia http://localhost:3000 en desarrollo.
    location: vite.config.js
    impact: En un despliegue estático sin proxy las llamadas a la API fallarían.
  - issue: El token JWT se guarda en localStorage.
    location: src/composables/useAuth.js
    impact: Es accesible desde JavaScript de la propia página; no hay cookies httpOnly.
  - issue: No hay recuperación de contraseña ni refresco automático del token.
    location: src/views/LoginView.vue
    impact: Al expirar el token el usuario debe volver a iniciar sesión.
  - issue: La cuenta de demostración solo existe si la API se ha sembrado con npm run seed.
    location: src/views/LoginView.vue
    impact: Sin seed, admin@demo.com / Admin123! no permite entrar.
